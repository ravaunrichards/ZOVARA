name: ZOVARA CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate workspace metadata
        run: node scripts/verify.mjs
      - name: Run unit and HTTP smoke tests
        run: node --test tests/*.test.mjs
      - name: Secret scan (baseline)
        run: node scripts/scan-secrets.mjs
      - name: Set up compatible Gradle for Android Gradle Plugin 8.11.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile Android project if SDK is installed
        shell: bash
        run: |
          if command -v gradle >/dev/null && [ -n "${ANDROID_HOME:-}" ]; then
            cd apps/android && gradle :app:assembleDebug
          else
            echo "Android SDK unavailable on this runner; Android build not claimed."
          fi
