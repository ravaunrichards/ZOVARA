services:
  - type: web
    name: zovara-api
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts && npm run verify
    startCommand: node services/api/src/server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: PORT
        value: "10000"
      - key: PUBLIC_APP_URL
        value: https://zovara-api.onrender.com
      - key: CORS_ORIGINS
        value: https://zovara-api.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PAYOUTS_ENABLED
        value: "false"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_DEFAULT_ROOM_MAX_PARTICIPANTS
        value: "100"
      - key: SUPABASE_MEDIA_BUCKET
        value: media
      - key: MAX_UPLOAD_BYTES
        value: "524288000"
      - key: TRUST_PROXY
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"
      - key: COIN_CUSTOM_MIN
        value: "100"
      - key: COIN_CUSTOM_MAX
        value: "1000000"
      - key: COIN_PRICE_PER_100_USD
        value: "1.00"
      - key: CREATOR_SHARE_BPS
        value: "5000"
      - key: PAYPAL_PAYOUTS_CURRENCY
        value: USD
  - type: worker
    name: zovara-background-worker
    runtime: node
    plan: starter
    buildCommand: npm install --ignore-scripts
    startCommand: node services/background-workers/src/worker.mjs
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
